name: Python autotests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Choose tests set"
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - regression
          - extended
          - all


jobs:
  run-tests:
    name: Run autotests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1


      - name: Run all tests
        if: github.event.inputs.deployment_target == 'all'
        run: pytest --alluredir=allure-results
        continue-on-error: true


      - name: Run smoke tests
        if: github.event.inputs.deployment_target == 'smoke'
        run: pytest -m smoke --alluredir=allure-results
        continue-on-error: true


      - name: Run regression tests
        if: github.event.inputs.deployment_target == 'regression'
        run: pytest -m regression --alluredir=allure-results
        continue-on-error: true


      - name: Run extended tests
        if: github.event.inputs.deployment_target == 'extended'
        run: pytest -m extended --alluredir=allure-results
        continue-on-error: true


      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"


      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          sudo tar -zxvf allure-2.29.0.tgz -C /opt
          sudo ln -s /opt/allure-2.29.0/bin/allure /usr/bin/allure


      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report


      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 1
